<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#060a12" />
    <title>Page Not Found | MJL Solutions</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: #060a12;
        color: #f1f5f9;
        font-family: Inter, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: min(100%, 680px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid #245566;
        border-radius: 16px;
        background: #0b111d;
      }
      p {
        color: #a8b3c3;
      }
      .eyebrow {
        color: #22d3ee;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0;
        font-size: clamp(2.4rem, 10vw, 5rem);
        line-height: 1;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 30px;
      }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 10px 16px;
        border: 1px solid #245566;
        border-radius: 9px;
        color: #f1f5f9;
        font-weight: 700;
        text-decoration: none;
      }
      a:first-child {
        border-color: #22d3ee;
        background: #22d3ee;
        color: #031015;
      }
      a:focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Page not found</p>
      <h1>This page is not here.</h1>
      <p>
        The address may have changed. Return to the MJL Solutions portfolio or
        go directly to the case studies or contact section.
      </p>
      <nav aria-label="Page not found options">
        <a href="/MJL-Solutions/">Return home</a>
        <a href="/MJL-Solutions/#projects">View case studies</a>
        <a href="/MJL-Solutions/#contact">Start a project</a>
      </nav>
    </main>
  </body>
</html>
